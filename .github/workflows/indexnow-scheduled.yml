name: IndexNow scheduled posts

# Blog posts go live at their publish time (09:00, 12:00, 15:00 and 18:00 Tbilisi) without a deploy, and the sitemap
# is rebuilt hourly. About an hour after each slot, submit the URLs whose lastmod falls in the last 3 hours.
# 06:15, 09:15, 12:15 and 15:15 UTC = 10:15, 13:15, 16:15 and 19:15 Tbilisi (UTC+4, no daylight saving).

on:
  schedule:
    - cron: "15 6,9,12,15 * * *"
  workflow_dispatch:

jobs:
  submit:
    name: Submit recently published URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs --since-hours 3
